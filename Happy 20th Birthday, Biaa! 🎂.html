<!doctype html>
<html lang="en"><head><meta charset="utf-8" data-keep="">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-keep="">
<title data-keep="">Happy 20th Birthday, Biaa! 🎂</title>
<link data-keep="" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&amp;family=Quicksand:wght@500;700&amp;display=swap" rel="stylesheet">
<style id="css" data-keep="">
:root{--bg:#fff0f6;--bg2:#ffe0ee;--ink:#4a1d3f;--soft:#7d4a6e;--pink:#ff5fa2;--lilac:#b69cff;--sun:#ffd666;--mint:#7fe3c4;--card:#fff;--shadow:rgba(255,95,162,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1030;--bg2:#3a1745;--ink:#ffe9f4;--soft:#e7bcd6;--card:#4a2058;--shadow:rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1030;--bg2:#3a1745;--ink:#ffe9f4;--soft:#e7bcd6;--card:#4a2058;--shadow:rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Quicksand,"Trebuchet MS",sans-serif;font-weight:500;line-height:1.6;overflow-x:hidden}
h1,h2,h3{font-family:"Bagel Fat One","Arial Rounded MT Bold",Impact,sans-serif;font-weight:400;line-height:1.05}
section{padding:84px 20px;max-width:1000px;margin:auto;position:relative}
h2{font-size:clamp(2rem,6vw,3.2rem);text-align:center;margin-bottom:10px;color:var(--pink)}
.sub{text-align:center;color:var(--soft);margin-bottom:42px}
.btn{border:0;cursor:pointer;font:700 1.05rem Quicksand,sans-serif;color:#fff;background:var(--pink);padding:14px 30px;border-radius:99px;box-shadow:0 6px 0 #d63d82;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #d63d82}
.btn:focus-visible,.card:focus-visible,.cp:focus-visible,.mp:focus-visible{outline:3px solid var(--lilac);outline-offset:4px}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(30px)}to{opacity:1;transform:none}}
/* gate */
.gate{min-height:100svh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 30% 20%,var(--bg2),transparent 60%)}
.gc{background:var(--card);border-radius:28px;padding:34px 28px;max-width:400px;width:100%;text-align:center;box-shadow:0 18px 44px var(--shadow);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
.gc h1{font-size:2.2rem;color:var(--pink);margin:6px 0 10px}
.gc input{width:100%;padding:14px 18px;border-radius:99px;border:2px solid var(--lilac);background:var(--bg);color:var(--ink);font:700 1rem Quicksand,sans-serif;margin:16px 0;text-align:center}
.gm{min-height:3em;color:var(--soft);font-size:.95rem;margin-top:14px}
/* gift */
#gift{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;text-align:center;cursor:pointer;transition:opacity .8s,transform .8s}
#gift.go{opacity:0;transform:scale(1.4);pointer-events:none}
#gift .gb{font-size:7rem;animation:shake 1.2s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg) scale(1.08)}40%{transform:rotate(10deg) scale(1.08)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
#gift p{font-family:"Bagel Fat One",sans-serif;font-size:1.7rem;color:var(--pink)}
/* hero */
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 20% 15%,var(--bg2),transparent 55%),radial-gradient(circle at 85% 80%,#e6dcff66,transparent 55%);overflow:hidden;padding:30px 16px;position:relative}
.hero h1{font-size:clamp(3rem,13vw,8rem);color:var(--pink);text-shadow:4px 4px 0 var(--sun),8px 8px 0 var(--lilac)}
.hero h1 .l{display:inline-block;animation:drop 1s cubic-bezier(.2,1.6,.4,1) both,wob 3s ease-in-out infinite;animation-delay:calc(var(--i)*.07s),calc(1s + var(--i)*.1s)}
@keyframes drop{from{opacity:0;transform:translateY(-140px) rotate(-45deg) scale(.3)}to{opacity:1;transform:none}}
@keyframes wob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(3deg)}}
.name{font-size:clamp(1.4rem,5vw,2.6rem);margin-top:26px;font-family:"Bagel Fat One",sans-serif}
.shim{background:linear-gradient(90deg,#ff5fa2,#b69cff,#ffd666,#7fe3c4,#ff5fa2);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shim 4s linear infinite}
@keyframes shim{to{background-position:300% 0}}
.n20{display:flex;justify-content:center;gap:8px;font-family:"Bagel Fat One",sans-serif;font-size:clamp(2.6rem,9vw,4.6rem);margin-top:22px}
.n20 span{display:grid;place-items:center;width:1.35em;height:1.35em;line-height:1;border-radius:50%;color:#fff;background:var(--pink);box-shadow:0 7px 0 #d63d82;animation:bal 3s ease-in-out infinite}
.n20 span+span{background:var(--lilac);box-shadow:0 7px 0 #8d6ee0;animation-delay:-1.5s}
@keyframes bal{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}
.type{min-height:3.2em;margin:18px auto 22px;max-width:460px;color:var(--soft)}
.caret::after{content:"|";margin-left:2px;animation:cr .7s steps(1) infinite}
@keyframes cr{50%{opacity:0}}
#boom{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #d63d82,0 0 0 0 rgba(255,95,162,.5)}50%{box-shadow:0 6px 0 #d63d82,0 0 0 18px rgba(255,95,162,0)}}
.float{position:absolute;font-size:2.2rem;animation:bob 6s ease-in-out infinite;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.hero-in{position:relative;z-index:2;animation:pop 1s cubic-bezier(.2,1.4,.4,1) both}
.marq{overflow:hidden;white-space:nowrap;background:var(--pink);color:#fff;padding:14px 0;transform:rotate(-1.5deg);margin:10px -10px;font-family:"Bagel Fat One",sans-serif;font-size:1.6rem;box-shadow:0 8px 20px var(--shadow)}
.marq div{display:inline-block;animation:mq 20s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.wd{display:inline-block}
.cl{display:inline-block;animation:wv 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.09s)}
@keyframes wv{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* meet */
.meet{display:grid;gap:40px;align-items:center;grid-template-columns:1fr}
@media(min-width:760px){.meet{grid-template-columns:1fr 1fr}}
.heart{width:min(340px,80%);aspect-ratio:1;margin:auto;position:relative;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.heart svg{position:absolute;width:0;height:0}
.heart .ph{clip-path:url(#hc);filter:drop-shadow(0 12px 18px var(--shadow))}
.meet h2{text-align:left}.meet p{margin-top:12px;color:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tags span{background:var(--card);padding:6px 14px;border-radius:99px;box-shadow:0 3px 10px var(--shadow);font-weight:700}
.rv.on .tags span{animation:tg .6s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*.12s + .3s)}
@keyframes tg{from{opacity:0;transform:scale(0) rotate(-20deg)}to{opacity:1;transform:none}}
.ph{display:block;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
/* gallery */
.gallery{display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.polaroid{background:#fff;padding:12px 12px 52px;border-radius:6px;box-shadow:0 10px 26px var(--shadow);position:relative}
.polaroid .box{aspect-ratio:1;overflow:hidden;border-radius:3px}
.polaroid b{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:"Bagel Fat One",cursive;font-weight:400;color:#4a1d3f;font-size:1.1rem;padding:0 8px}
.polaroid::before{content:"";position:absolute;top:-12px;left:50%;width:70px;height:24px;transform:translateX(-50%) rotate(-3deg);background:var(--sun);opacity:.85;border-radius:3px}
.polaroid:nth-child(even)::before{background:var(--mint)}.polaroid:nth-child(3n)::before{background:var(--lilac)}
.polaroid.rv{opacity:0;transform:rotate(calc(var(--r)*4)) translateY(90px) scale(.5);transition:opacity .9s ease,transform .9s cubic-bezier(.2,1.4,.4,1)}
.polaroid.rv.on{opacity:1;transform:rotate(var(--r));transition:opacity .9s ease,transform .45s cubic-bezier(.2,1.5,.4,1)}
.polaroid.rv.on:hover{transform:rotate(0) scale(1.08) translateY(-8px);z-index:3}
#lb{position:fixed;inset:0;z-index:95;background:#000c;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s;cursor:zoom-out}
#lb.on{opacity:1;pointer-events:auto}
#lb img{max-width:92vw;max-height:88vh;border-radius:12px;transform:scale(.8);transition:transform .4s cubic-bezier(.2,1.4,.4,1)}
#lb.on img{transform:none}
/* cards */
.cards{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{perspective:900px;height:190px;cursor:pointer;border-radius:22px}
.card.rv{transform:translateY(50px) scale(.85)}.card.rv.on{transform:none}
.card .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;text-align:center;padding:18px;backface-visibility:hidden;box-shadow:0 8px 20px var(--shadow)}
.card .f{background:var(--c);font-size:3rem;color:#4a1d3f}
.card .f small{display:block;font:700 .95rem Quicksand,sans-serif}
.card .b{background:var(--card);transform:rotateY(180deg);font-weight:700}
/* level, list, words, coupons */
.lv{max-width:560px;margin:auto;background:var(--card);padding:24px;border-radius:24px;box-shadow:0 10px 26px var(--shadow)}
.lvt{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}
.track{height:22px;border-radius:99px;background:var(--bg2);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(45deg,var(--pink) 0 14px,#ff8fc0 14px 28px);background-size:40px 40px;transition:width 2.4s cubic-bezier(.3,1,.4,1);animation:stripe 1s linear infinite}
.on .track i{width:100%}
@keyframes stripe{to{background-position:40px 0}}
.done{text-align:center;margin-top:16px;opacity:0;transform:scale(.6);transition:opacity .7s,transform .7s cubic-bezier(.2,1.6,.4,1);transition-delay:2.4s}
.on .done{opacity:1;transform:none}
.list20{list-style:none;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.list20 li{display:flex;gap:12px;align-items:center;background:var(--card);padding:10px 18px 10px 10px;border-radius:99px;box-shadow:0 4px 14px var(--shadow);opacity:0;transform:translateX(var(--x));transition:opacity .6s,transform .7s cubic-bezier(.2,1.4,.4,1);transition-delay:calc(var(--i)*.06s)}
.list20.on li{opacity:1;transform:none}
.list20 b{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:#fff;font-family:"Bagel Fat One",sans-serif;font-weight:400}
.words{font-family:"Bagel Fat One",sans-serif;font-size:clamp(1.5rem,4.5vw,2.4rem);line-height:1.35;text-align:center;max-width:760px;margin:auto}
.words span{display:inline-block;opacity:.12;transform:translateY(10px) scale(.9);transition:opacity .6s,transform .6s cubic-bezier(.2,1.5,.4,1);transition-delay:calc(var(--i)*.07s)}
.on .words span{opacity:1;transform:none}.words span.hl{color:var(--pink)}
.coupons{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.cp{position:relative;border:3px dashed #4a1d3f66;background:var(--c);color:#4a1d3f;border-radius:18px;padding:22px 14px;font:inherit;font-size:2.4rem;cursor:pointer;display:grid;gap:4px;text-align:center;transition:transform .3s cubic-bezier(.2,1.6,.4,1)}
.cp:hover{transform:rotate(-2deg) scale(1.04)}
.cp b{font:700 1.1rem Quicksand,sans-serif}.cp small{font:500 .9rem Quicksand,sans-serif}
.cp::after{content:"REDEEMED";position:absolute;inset:0;display:grid;place-items:center;font:400 1.6rem "Bagel Fat One",sans-serif;color:#e0245e;border:4px solid #e0245e;border-radius:18px;background:#fff9;transform:scale(3) rotate(-14deg);opacity:0;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s;pointer-events:none}
.cp.used::after{opacity:1;transform:scale(1) rotate(-14deg)}
/* wish, letter, footer */
.wish{text-align:center}
.cake{width:min(280px,80%);margin:0 auto;cursor:pointer;display:block;background:none;border:0}
.flame{transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.out .flame{display:none}.smoke{opacity:0}.out .smoke{animation:smoke 2s ease-out}
@keyframes smoke{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.wishmsg,.secretmsg{min-height:3.4em;margin:20px auto 0;max-width:480px;font-family:"Bagel Fat One",sans-serif;font-size:1.45rem;color:var(--pink)}
.letter{background:var(--card);border-radius:20px;padding:clamp(24px,5vw,56px);box-shadow:0 14px 34px var(--shadow);position:relative;transform:rotate(-1deg)}
.letter::before{content:"💌";position:absolute;top:-26px;right:30px;font-size:3rem}
.letter h2{text-align:left;font-size:2rem}.letter p{margin-top:14px;font-size:1.08rem}
.sign{font-family:"Bagel Fat One",sans-serif;color:var(--pink);font-size:1.4rem;margin-top:22px}
.letter p,.letter .sign{opacity:0;transform:translateX(-24px);transition:opacity .8s,transform .8s cubic-bezier(.2,1.2,.4,1)}
.letter p:nth-of-type(1){--k:0}.letter p:nth-of-type(2){--k:1}.letter p:nth-of-type(3){--k:2}.letter .sign{--k:3}
.on .letter p,.on .letter .sign{opacity:1;transform:none;transition-delay:calc(var(--k)*.6s + .5s)}
footer{text-align:center;padding:50px 20px 110px;color:var(--soft)}footer .big{font-size:2.6rem;margin-bottom:14px}
/* fx + chrome */
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#bar{position:fixed;top:0;left:0;height:5px;width:0;background:linear-gradient(90deg,var(--pink),var(--sun),var(--lilac),var(--mint));z-index:60;border-radius:0 5px 5px 0}
.rise{position:fixed;bottom:-50px;z-index:-1;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) translateX(var(--dx)) rotate(40deg);opacity:0}}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.9,.3,1)}.rv.on{opacity:1;transform:none}
.mp,.fab{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border:0;padding:10px 16px;border-radius:99px;box-shadow:0 6px 18px var(--shadow);font:700 .95rem Quicksand,sans-serif;cursor:pointer}
.mp{left:14px}.fab{right:14px}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}.eq i{width:4px;background:var(--pink);height:4px;border-radius:2px}
.mp.on .eq i{animation:eq .8s ease-in-out infinite alternate}.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}
@keyframes eq{to{height:16px}}
/* admin */
.ad{position:fixed;inset:0;z-index:90;background:#0007;display:flex;justify-content:flex-end}
.adp{background:var(--bg);color:var(--ink);width:min(520px,100%);height:100%;overflow:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.adp h3{font-size:1.5rem;color:var(--pink);margin:22px 0 8px}
.adp label{display:block;font-weight:700;margin:12px 0 4px;font-size:.9rem}
.adp textarea,.adp input[type=text]{width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--lilac);background:var(--card);color:var(--ink);font:500 .95rem Quicksand,sans-serif}
.adp textarea{resize:vertical}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
.row{display:flex;gap:10px;align-items:center;margin:8px 0}
.mini{border:0;border-radius:99px;padding:8px 14px;background:var(--lilac);color:#fff;font:700 .85rem Quicksand,sans-serif;cursor:pointer;flex:none}
.stick{position:sticky;bottom:-20px;background:var(--bg);padding:14px 0}
section:not(.live) .cl,.hero:not(.live) *{animation-play-state:paused}
.heart{will-change:transform}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.polaroid.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style></head>

<script id="state" type="application/json">{"open":true,"texts":{"title":"Happy\nBirthday!","name":"Salsa Bila Cuyunda","phrases":"Today is all about you.\nWelcome to your twenties! 🎉\nGrab some cake, you deserve it 🍰\nYou’re my favorite person ever 💖\nTwenty looks so good on you ✨","marq":"HAPPY 20TH BIRTHDAY BIAA","meet":"Salsa Bila Cuyunda, but to me she is Biaa: the brightest smile in every room, the best part of my days, and officially the main character of her 20th birthday.","tags":"🎂 20 today!\n🌸 Sweet\n😂 Funny\n✨ Sparkly\n🍓 My favorite","memTitle":"Our little memories","memSub":"Every picture here is a tiny reason to smile.","reasons":"💖|Your smile|It can fix my worst day in one second.\n😂|Your laugh|The best sound in the whole world.\n🤗|Your hugs|Warm, cozy, and exactly where I belong.\n🌟|Your kindness|You care so much, and everyone feels it.\n🍓|Your sweetness|Even your small gestures are huge to me.\n🏡|Being with you|Wherever you are, that is my favorite place.","list20":"The way you laugh at your own jokes\nYour “five more minutes” voice\nHow you light up when you see food\nYour cute little frown when you’re sleepy\nThe way you say my name\nYour hugs that fix everything\nHow kind you are to everyone\nOur random midnight talks\nHow you care about the little things\nYour goofy faces\nHow you make ordinary days feel special\nYour sweet voice messages\nHow big you dream\nThe way you cheer me on\nYour pretty eyes when you smile\nHow strong you are, even when you’re tired\nYour love for sweet treats\nHow you make me want to be better\nEvery inside joke we have\nSimply that you’re you","poem":"Twenty years ago, the world got a little brighter. Today I get to celebrate the girl who turned my ordinary days into my favorite memories. Biaa, you are my sunshine, my safe place, and my sweetest surprise.","coupons":"🤗|One big hug|any time, any place\n🍕|Dinner date|you pick the place\n🎬|Movie night|snacks included\n🧸|Cuddle session|no phones allowed","wishSub":"It’s your 20th, so make it a big one. Tap the cake to blow out the candle.","wishes":"Your wish is on its way! ✨\nWish made! It will come true 💫\nYay! Happy 20th, Biaa! 🎉\nSweet wish, sweet girl 🍓","letterTitle":"Dear Biaa,","l1":"Happy 20th birthday, my love! Twenty years old and still the sweetest person I know. Thank you for being you: for the laughs, the warm hugs, and every little moment that makes life brighter.","l2":"I hope your twenties bring you endless happiness, big dreams that come true, and all the sweet things you deserve. Whatever comes, I will be right here cheering for you.","l3":"You mean the world to me. Now go eat a lot of cake! 🍰","sign":"Forever yours 💖","secretBtn":"One last surprise 💌","secretMsg":"Biaa, thank you for being you. I love you more than all the cake in the world. Happy 20th birthday! 💖","footer":"Made with love, for Salsa Bila Cuyunda.\nHappy 20th birthday! 💕"},"hero":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCASwBLADASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAcDBAUGCAIB/8QAVxAAAgIBAgMDBAsNBQYEBgEFAAECAwQFEQYSITFBUQcTYXEUFyIyNoGRk6Gx0RUWIzNCUlVydJKywdI0U1RicyRDgpTC4TWEovAlRGODs/Emw0Vk4qP/xAAbAQEAAgMBAQAAAAAAAAAAAAAABAUBAgMG
